<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn Location Enricher</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 380px;
      margin: 0;
      padding: 14px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; }
    input[type="file"] { width: 100%; font-size: 12px; }
    input[type="number"] { width: 70px; padding: 4px 6px; font-size: 13px; }
    button {
      padding: 7px 14px; border: none; border-radius: 5px;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #fff;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { background: #0a66c2; }
    .warn    { background: #b26a00; }
    .neutral { background: #555; }
    .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .bar { height: 8px; background: #e6e6e6; border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: #0a66c2; transition: width .3s; }
    .muted { color: #666; font-size: 12px; }
    .err { color: #b00020; font-size: 12px; white-space: pre-wrap; }
    .log {
      max-height: 130px; overflow-y: auto; border: 1px solid #e0e0e0;
      border-radius: 5px; padding: 6px; font-size: 11px; background: #fafafa;
    }
    .log div { padding: 1px 0; border-bottom: 1px solid #f0f0f0; }
    .log div:last-child { border-bottom: none; }
    .ok  { color: #0a6b34; }
    .nf  { color: #b26a00; }
    .bad { color: #b00020; }
    .notice {
      background: #fff8e1; border: 1px solid #ffe08a; border-radius: 5px;
      padding: 7px 9px; font-size: 11.5px; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>LinkedIn Location Enricher</h1>

  <div class="notice">
    Opens each URL in a real tab and reads the rendered page. Keep Chrome open
    and logged in to LinkedIn. Go easy on volume — a few hundred a day, not thousands.
  </div>

  <div class="row">
    <label for="file">1. CSV with LinkedIn URLs</label>
    <input type="file" id="file" accept=".csv,text/csv">
    <div class="muted" id="fileInfo">No file loaded.</div>
  </div>

  <div class="row">
    <label for="delay">2. Seconds between profiles</label>
    <input type="number" id="delay" value="10" min="3" max="120">
    <span class="muted">randomised ±40%</span>
  </div>

  <div class="row">
    <label><input type="checkbox" id="verbose"> Verbose (log DOM candidates to the tab console)</label>
  </div>

  <div class="row buttons">
    <button id="start" class="primary" disabled>Start</button>
    <button id="pause" class="warn" disabled>Pause</button>
    <button id="export" class="neutral" disabled>Download CSV</button>
    <button id="reset" class="neutral">Reset</button>
  </div>

  <div class="row">
    <div class="bar"><div id="barFill"></div></div>
    <div class="muted" id="progress">Idle.</div>
    <div class="err" id="error"></div>
  </div>

  <div class="row">
    <label>Recent results</label>
    <div class="log" id="log"><div class="muted">Nothing yet.</div></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
